name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The pure-logic modules under test (delta compression, deictic detection,
      # XML writer, session report) have no macOS/audio dependencies, so we install
      # the package WITHOUT deps (pyobjc/sounddevice are macOS-only) and just add
      # pytest. The runtime capture layers are exercised manually on macOS.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -e .
          pip install pytest
      - name: Run tests
        run: pytest -q tests/
